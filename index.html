<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F2F2F7">
  <title>Tutto</title>
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --label: #000000;
      --secondary: #8E8E93;
      --separator: #C6C6C8;
      --accent: #FF3B30;          /* iOS Red – Tutto-Feeling */
      --accent-dark: #D70015;
      --yellow: #FFCC00;          /* dezentes Tutto-Gelb */
      --fill: #E5E5EA;
      --green: #34C759;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--label);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ========== START SCREEN ========== */
    #start-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .nav-bar {
      padding: 8px 20px 4px;
      text-align: center;
    }

    .large-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 20px 20px 6px;
      color: var(--accent);
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: var(--secondary);
      padding: 0 20px 24px;
      text-align: center;
    }

    .group {
      background: var(--card);
      border-radius: 12px;
      margin: 0 16px 20px;
      overflow: hidden;
    }

    .player-input-row {
      display: flex;
      align-items: center;
      padding: 0 16px;
      min-height: 48px;
      border-bottom: 0.5px solid var(--separator);
    }

    .player-input-row:last-child {
      border-bottom: none;
    }

    .player-input-row input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 17px;
      padding: 12px 0;
      outline: none;
      color: var(--label);
      font-family: inherit;
    }

    .player-input-row input::placeholder {
      color: var(--secondary);
    }

    .btn-remove {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 12px;
      -webkit-appearance: none;
    }

    .btn-remove:active {
      opacity: 0.7;
    }

    .btn-add {
      display: flex;
      align-items: center;
      gap: 12px;
      width: calc(100% - 32px);
      margin: 0 16px 24px;
      padding: 14px 16px;
      background: var(--card);
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 400;
      color: var(--accent);
      text-align: left;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .btn-add:active {
      background: var(--fill);
    }

    .btn-add::before {
      content: "+";
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 20px;
      font-weight: 500;
    }

    .btn-start {
      margin: 8px 16px calc(20px + var(--safe-bottom));
      padding: 16px;
      width: calc(100% - 32px);
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .btn-start:active {
      background: var(--accent-dark);
    }

    .btn-start:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* ========== GAME SCREEN ========== */
    #game-screen {
      flex: 1;
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      padding-top: var(--safe-top);
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px 10px;
      background: var(--bg);
    }

    .game-header .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
      text-align: center;
      color: var(--accent);
    }

    .scores-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
      padding: 0 16px 8px;
    }

    .score-group {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
    }

    .player-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--separator);
      background: var(--card);
      transition: background 0.15s;
    }

    .player-card:last-child {
      border-bottom: none;
    }

    .player-card.current {
      background: #FFF5F5;
    }

    .player-card.winner {
      background: #F0FFF4;
    }

    .player-name {
      font-size: 17px;
      font-weight: 400;
    }

    .player-card.current .player-name {
      font-weight: 600;
      color: var(--accent);
    }

    .player-score {
      font-size: 17px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--label);
    }

    .player-card.current .player-score {
      color: var(--accent);
    }

    .player-card.winner .player-score {
      color: var(--green);
    }

    .turn-bar {
      text-align: center;
      padding: 10px 16px 4px;
      font-size: 15px;
      color: var(--secondary);
      flex-shrink: 0;
    }

    .turn-bar strong {
      color: var(--accent);
      font-weight: 600;
    }

    .points-display {
      text-align: center;
      padding: 4px 16px 10px;
      flex-shrink: 0;
    }

    .points-display .value {
      font-size: 48px;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: var(--label);
      line-height: 1.1;
    }

    /* Numpad – Apple Calculator style */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 8px 16px calc(12px + var(--safe-bottom));
      background: var(--bg);
      flex-shrink: 0;
    }

    .numpad button {
      height: 58px;
      border: none;
      border-radius: 29px;
      background: var(--card);
      color: var(--label);
      font-size: 28px;
      font-weight: 400;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      cursor: pointer;
      -webkit-appearance: none;
      user-select: none;
    }

    .numpad button:active {
      background: var(--fill);
    }

    .numpad .btn-clear {
      font-size: 22px;
      color: var(--accent);
      font-weight: 500;
    }

    .numpad .btn-enter {
      grid-column: span 2;
      background: var(--accent);
      color: white;
      font-size: 20px;
      font-weight: 600;
    }

    .numpad .btn-enter:active {
      background: var(--accent-dark);
    }

    /* Winner Overlay */
    #winner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 24px;
    }

    #winner-overlay.show {
      display: flex;
    }

    .winner-box {
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      max-width: 300px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .winner-box h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .winner-box .name {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      margin: 8px 0;
    }

    .winner-box .score {
      font-size: 17px;
      color: var(--secondary);
      margin-bottom: 24px;
    }

    .winner-box button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      margin-top: 8px;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .winner-box button.secondary {
      background: var(--fill);
      color: var(--label);
    }

    .winner-box button:active {
      opacity: 0.8;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- START SCREEN -->
  <div id="start-screen">
    <div class="large-title">Tutto</div>
    <div class="subtitle">Ziel: 6.000 Punkte</div>

    <div class="group" id="players-list">
      <!-- Player inputs -->
    </div>

    <button class="btn-add" id="btn-add-player">Spieler hinzufügen</button>
    <button class="btn-start" id="btn-start" disabled>Spiel starten</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen">
    <div class="game-header">
      <div class="title">Tutto</div>
    </div>

    <div class="scores-area" id="scores-area">
      <div class="score-group" id="score-group">
        <!-- Player cards -->
      </div>
    </div>

    <div class="turn-bar" id="turn-info">
      Am Zug: <strong id="current-name">–</strong>
    </div>

    <div class="points-display">
      <div class="value" id="points-value">0</div>
    </div>

    <div class="numpad" id="numpad">
      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="btn-clear" id="btn-clear">⌫</button>
      <button data-num="0">0</button>
      <button class="btn-enter" id="btn-enter">Fertig</button>
    </div>
  </div>

  <!-- Winner Overlay -->
  <div id="winner-overlay">
    <div class="winner-box">
      <h2>🎉 Gewonnen!</h2>
      <div class="name" id="winner-name">Spieler</div>
      <div class="score" id="winner-score">6.000 Punkte</div>
      <button id="btn-new-game">Neues Spiel</button>
      <button class="secondary" id="btn-continue">Weiterspielen</button>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    let players = [];
    let currentIndex = 0;
    let currentInput = "0";
    let gameOver = false;
    const TARGET = 6000;

    const startScreen = document.getElementById("start-screen");
    const gameScreen = document.getElementById("game-screen");
    const playersList = document.getElementById("players-list");
    const btnAdd = document.getElementById("btn-add-player");
    const btnStart = document.getElementById("btn-start");
    const scoresArea = document.getElementById("scores-area");
    const scoreGroup = document.getElementById("score-group");
    const currentNameEl = document.getElementById("current-name");
    const pointsValue = document.getElementById("points-value");
    const winnerOverlay = document.getElementById("winner-overlay");
    const winnerName = document.getElementById("winner-name");
    const winnerScore = document.getElementById("winner-score");
    const btnNewGame = document.getElementById("btn-new-game");
    const btnContinue = document.getElementById("btn-continue");
    const btnClear = document.getElementById("btn-clear");
    const btnEnter = document.getElementById("btn-enter");

    function addPlayerInput(name = "") {
      const row = document.createElement("div");
      row.className = "player-input-row";
      row.innerHTML = `
        <input type="text" placeholder="Name" maxlength="20" value="${name}" autocomplete="off" enterkeyhint="done">
        <button class="btn-remove" type="button">×</button>
      `;
      const input = row.querySelector("input");
      const removeBtn = row.querySelector(".btn-remove");

      input.addEventListener("input", updateStartButton);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          input.blur();
        }
      });

      function onRemove(e) {
        e.preventDefault();
        e.stopPropagation();
        if (playersList.children.length > 1) {
          row.remove();
          updateStartButton();
        }
      }
      removeBtn.addEventListener("click", onRemove);
      removeBtn.addEventListener("touchend", onRemove, { passive: false });

      playersList.appendChild(row);
      updateStartButton();
      if (!name) {
        setTimeout(() => {
          row.scrollIntoView({ behavior: "smooth", block: "nearest" });
          input.focus();
        }, 50);
      }
    }

    function updateStartButton() {
      const inputs = [...playersList.querySelectorAll("input")];
      const valid = inputs.filter(i => i.value.trim().length > 0);
      btnStart.disabled = valid.length < 1;
    }

    let lastAddTime = 0;
    function onAddPlayer(e) {
      e.preventDefault();
      e.stopPropagation();
      const now = Date.now();
      if (now - lastAddTime < 400) return;
      lastAddTime = now;
      addPlayerInput();
    }
    btnAdd.addEventListener("click", onAddPlayer);
    btnAdd.addEventListener("touchend", onAddPlayer, { passive: false });

    btnStart.addEventListener("click", (e) => {
      e.preventDefault();
      startGame();
    });
    btnStart.addEventListener("touchend", (e) => {
      e.preventDefault();
      if (!btnStart.disabled) startGame();
    }, { passive: false });

    addPlayerInput();
    addPlayerInput();

    function startGame() {
      const inputs = [...playersList.querySelectorAll("input")];
      players = inputs
        .map(i => i.value.trim())
        .filter(n => n.length > 0)
        .map(name => ({ name, score: 0 }));

      if (players.length === 0) return;

      currentIndex = 0;
      currentInput = "0";
      gameOver = false;

      startScreen.style.display = "none";
      gameScreen.style.display = "flex";
      winnerOverlay.classList.remove("show");

      renderScores();
      updateTurnInfo();
      updatePointsDisplay();
    }

    function renderScores() {
      scoreGroup.innerHTML = "";
      players.forEach((p, i) => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.dataset.index = i;
        if (i === currentIndex && !gameOver) card.classList.add("current");
        if (p.score >= TARGET) card.classList.add("winner");

        card.innerHTML = `
          <div class="player-name">${escapeHtml(p.name)}</div>
          <div class="player-score">${p.score.toLocaleString("de-DE")}</div>
        `;
        scoreGroup.appendChild(card);
      });

      const currentCard = scoreGroup.querySelector(".player-card.current");
      if (currentCard) {
        setTimeout(() => {
          currentCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 30);
      }
    }

    function updateTurnInfo() {
      if (players.length === 0) return;
      currentNameEl.textContent = players[currentIndex].name;
    }

    function updatePointsDisplay() {
      pointsValue.textContent = currentInput === "" ? "0" : Number(currentInput).toLocaleString("de-DE");
    }

    function appendDigit(d) {
      if (gameOver) return;
      if (currentInput === "0") {
        currentInput = d;
      } else if (currentInput.length < 5) {
        currentInput += d;
      }
      updatePointsDisplay();
    }

    function clearInput() {
      if (gameOver) return;
      currentInput = "0";
      updatePointsDisplay();
    }

    function confirmPoints() {
      if (gameOver) return;
      const points = parseInt(currentInput, 10) || 0;
      if (points < 0) return;

      players[currentIndex].score += points;
      currentInput = "0";
      updatePointsDisplay();

      if (players[currentIndex].score >= TARGET) {
        gameOver = true;
        renderScores();
        showWinner(players[currentIndex]);
        return;
      }

      currentIndex = (currentIndex + 1) % players.length;
      renderScores();
      updateTurnInfo();
    }

    function showWinner(player) {
      winnerName.textContent = player.name;
      winnerScore.textContent = player.score.toLocaleString("de-DE") + " Punkte";
      winnerOverlay.classList.add("show");
      launchConfetti();
    }

    document.getElementById("numpad").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.dataset.num !== undefined) {
        appendDigit(btn.dataset.num);
      }
    });

    btnClear.addEventListener("click", clearInput);
    btnEnter.addEventListener("click", confirmPoints);

    btnNewGame.addEventListener("click", () => {
      winnerOverlay.classList.remove("show");
      stopConfetti();
      playersList.innerHTML = "";
      addPlayerInput();
      addPlayerInput();
      startScreen.style.display = "flex";
      gameScreen.style.display = "none";
      gameOver = false;
    });

    btnContinue.addEventListener("click", () => {
      winnerOverlay.classList.remove("show");
      stopConfetti();
      gameOver = false;
      currentIndex = (currentIndex + 1) % players.length;
      renderScores();
      updateTurnInfo();
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[m]);
    }

    // Confetti
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    let confettiPieces = [];
    let confettiAnim = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function launchConfetti() {
      confettiPieces = [];
      const colors = ["#FF3B30", "#FFCC00", "#34C759", "#007AFF", "#FF9500", "#AF52DE"];
      for (let i = 0; i < 150; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: 7 + Math.random() * 7,
          h: 5 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: 2 + Math.random() * 4,
          rot: Math.random() * 360,
          rotSpeed: -4 + Math.random() * 8,
          sway: Math.random() * 2 - 1
        });
      }
      if (confettiAnim) cancelAnimationFrame(confettiAnim);
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      confettiPieces.forEach(p => {
        p.y += p.speed;
        p.x += Math.sin(p.y * 0.02) * p.sway;
        p.rot += p.rotSpeed;
        if (p.y < canvas.height + 20) alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (alive) confettiAnim = requestAnimationFrame(animateConfetti);
    }

    function stopConfetti() {
      if (confettiAnim) cancelAnimationFrame(confettiAnim);
      confettiAnim = null;
      confettiPieces = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Prevent double-tap zoom on non-interactive areas
    let lastTouchEnd = 0;
    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        const tag = e.target.tagName;
        if (tag !== "BUTTON" && tag !== "INPUT" && !e.target.closest("button")) {
          e.preventDefault();
        }
      }
      lastTouchEnd = now;
    }, { passive: false });
  </script>
</body>
</html>
